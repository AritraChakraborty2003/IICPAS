services:
  mongo:
    image: mongo:7
    container_name: iicpas-mongo-prod
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iicpas-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/iicpa
      CLIENT_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8080/api
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongo

  static-backend:
    build:
      context: ./static-backend
      dockerfile: Dockerfile
    container_name: iicpas-static-backend-prod
    restart: unless-stopped
    env_file:
      - ./static-backend/.env.docker
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/static_backend
      MONGODB_DB_NAME: static_backend
      CDN_BASE_URL: http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - static_backend_uploads:/app/uploads
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_API_BASE: http://localhost:8080/api
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    container_name: iicpas-client-prod
    restart: unless-stopped
    env_file:
      - ./client/.env.docker
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_API_BASE: http://localhost:8080/api
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - static-backend

volumes:
  mongo_data:
  backend_uploads:
  static_backend_uploads:
